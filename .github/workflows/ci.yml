name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
      - name: Core and worker tests (no FreeCAD, no Qt)
        run: pytest tests/core tests/worker
      - name: GUI tests (headless Qt)
        run: pytest tests/gui
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Style check
        run: ruff check freecad tests
      # Integration tests (compiled GRBL simulator) will be added at
      # step E16, Linux only. pyserial arrives via the dev dependency
      # group, so the serial
      # transport test (pyserial loop://, software-only) now runs here
      # on all three OSes instead of being skipped.
